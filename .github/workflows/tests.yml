name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q companion listener tests
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test extension background
        run: node tests/test-background.mjs
      - name: Test extension popup
        run: node tests/test-popup.mjs
